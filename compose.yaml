services:
  crossword-maker:
    build:
      context: .
      dockerfile: Dockerfile
    image: crossword-maker:local
    container_name: crossword-maker
    restart: unless-stopped
    ports:
      - "${CROSSWORD_PORT:-8085}:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: crossword-maker-api:local
    restart: unless-stopped
    volumes:
      - crossword-data:/data
    environment:
      DATA_DIR: /data
    expose:
      - "3001"

volumes:
  crossword-data:
